name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure platform paths
        run: |
          echo "FOVEA_DATA_DIR=${RUNNER_TEMP}/fovea-data" >> "$GITHUB_ENV"
          echo "FOVEA_MODEL_PATH=${RUNNER_TEMP}/fovea-cache/face_landmarker.task" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.12" }

      - name: Enforce source network boundary
        run: python scripts/check_no_network.py src

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Cache FaceLandmarker model
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/fovea-cache/face_landmarker.task
          key: face-landmarker-64184e229b263107bc2b804c6625db1341ff2bb731874b0bcc2fe6544e0bc9ff

      - name: Download model (verified by SHA-256)
        run: uv run python scripts/download_mediapipe_model.py

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Verify generated protocol schema
        run: |
          uv run python scripts/generate_protocol_schema.py
          git diff --exit-code -- schema/fovea-protocol-v1.json

      - name: Tests
        run: uv run pytest
