[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "fovea-input"
version = "0.1.0"
description = "Your gaze is an input."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{ name = "Wega Labs" }]
keywords = [
  "accessibility",
  "computer-vision",
  "eye-tracking",
  "gaze-tracking",
  "gesture-recognition",
  "human-computer-interaction",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Human Machine Interfaces",
]
dependencies = [
  "mediapipe>=0.10.21,<0.11",
  "numpy>=1.26,<3",
  "opencv-contrib-python>=4.10,<6",
]

[project.scripts]
fovea = "fovea.cli:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.18,<3",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fovea"]

[tool.mypy]
python_version = "3.12"
packages = ["fovea"]
strict = true

[[tool.mypy.overrides]]
module = ["mediapipe", "mediapipe.*", "cv2"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
