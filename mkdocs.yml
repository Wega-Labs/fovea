site_name: Fovea
site_description: Your gaze is an input. A local gaze input engine for ordinary cameras.
site_url: https://wega-labs.github.io/fovea/
repo_url: https://github.com/Wega-Labs/fovea
repo_name: Wega-Labs/fovea
edit_uri: edit/main/docs/
docs_dir: docs
strict: true

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: sphinx
            members_order: source
            show_root_heading: true
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            filters: ["!^_"]

not_in_nav: |
  /plans/**

nav:
  - Home: index.md
  - Concepts: concepts.md
  - Architecture: architecture.md
  - Host guides:
      - Python: guides/python.md
      - Node and Electron: guides/node-electron.md
  - Reference:
      - Wire protocol: protocol.md
      - Protocol messages: reference/protocol-messages.md
      - Python API: reference/python-api.md
  - Contributing: contributing.md
